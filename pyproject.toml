[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegarden"
version = "0.3.0.dev0"
description = "Private, CPU-powered raster to vector studio"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11,<14", "vtracer==1.0.0a4", "python-multipart>=0.0.20", "reportlab>=4,<5", "ezdxf>=1.3,<2", "svgpathtools>=1.6,<2", "opencv-python-headless>=4.10,<6", "shapely>=2.1,<3", "scikit-image>=0.24,<1", "defusedxml>=0.7,<1", "psutil>=6,<8", "resvg-py>=0.5,<1", "packaging>=24,<30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "playwright>=1.50", "ruff>=0.9"]

[project.scripts]
tracegarden = "tracegarden.__main__:main"

[tool.setuptools.package-data]
tracegarden = ["static/*"]

[tool.setuptools.packages.find]
include = ["tracegarden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

