[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegarden"
version = "0.1.0"
description = "Private, CPU-powered raster to vector studio"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11,<14", "vtracer==0.6.15", "python-multipart>=0.0.20", "reportlab>=4,<5", "svglib>=1.5,<3", "ezdxf>=1.3,<2", "svgpathtools>=1.6,<2", "rl-renderPM>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "playwright>=1.50"]

[project.scripts]
tracegarden = "tracegarden.__main__:main"

[tool.setuptools.package-data]
tracegarden = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

