name: Native desktop packages
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Clipboard acceptance on Windows and macOS
        if: runner.os != 'Linux'
        run: python scripts/check_clipboard.py
      - name: Clipboard acceptance on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xclip
          xvfb-run -a python scripts/check_clipboard.py
      - run: python scripts/package_native.py
      - name: Smoke test Windows
        timeout-minutes: 8
        if: runner.os == 'Windows'
        run: python scripts/smoke_native.py dist/TraceGarden/TraceGarden.exe
      - name: Smoke test macOS
        timeout-minutes: 8
        if: runner.os == 'macOS'
        run: python scripts/smoke_native.py dist/TraceGarden.app/Contents/MacOS/TraceGarden
      - name: Smoke test Linux
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: python scripts/smoke_native.py dist/TraceGarden/TraceGarden
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          Compress-Archive dist/TraceGarden dist/TraceGarden-Windows-portable.zip
      - name: Windows install, launch and uninstall acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installProbe = Join-Path $env:RUNNER_TEMP 'TraceGarden-install-check'
          $installResult = Start-Process -FilePath 'dist/TraceGarden-Windows-Setup.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installProbe") -Wait -PassThru -WindowStyle Hidden
          if ($installResult.ExitCode) { throw 'Silent installation failed' }
          python scripts/smoke_native.py "$installProbe/TraceGarden.exe"
          if ($LASTEXITCODE) { throw 'Installed application failed' }
          $uninstallResult = Start-Process -FilePath "$installProbe/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstallResult.ExitCode) { throw 'Uninstall failed' }
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg
          cp -R dist/TraceGarden.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname TraceGarden -srcfolder dist/dmg -ov -format UDZO "dist/TraceGarden-macOS-$(uname -m).dmg"
      - name: macOS disk image launch acceptance
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/TraceGardenDMG"
          hdiutil attach "dist/TraceGarden-macOS-$(uname -m).dmg" -nobrowse -mountpoint "$RUNNER_TEMP/TraceGardenDMG"
          python scripts/smoke_native.py "$RUNNER_TEMP/TraceGardenDMG/TraceGarden.app/Contents/MacOS/TraceGarden"
          hdiutil detach "$RUNNER_TEMP/TraceGardenDMG"
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/TraceGarden.AppDir/usr/bin
          cp -R dist/TraceGarden dist/TraceGarden.AppDir/usr/bin/
          cp packaging/TraceGarden.desktop dist/TraceGarden.AppDir/
          python -c "from PIL import Image,ImageDraw;i=Image.new('RGB',(256,256),'#315d45');d=ImageDraw.Draw(i);d.polygon([(128,30),(226,128),(128,226),(30,128)],fill='#f4dfaa');i.save('dist/TraceGarden.AppDir/TraceGarden.png')"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/TraceGarden/TraceGarden" "$@"\n' > dist/TraceGarden.AppDir/AppRun
          chmod +x dist/TraceGarden.AppDir/AppRun
          curl -L --fail https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o dist/appimagetool.AppImage
          chmod +x dist/appimagetool.AppImage
          cd dist
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun TraceGarden.AppDir TraceGarden-Linux-x86_64.AppImage
      - name: Linux AppImage launch acceptance
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/TraceGardenAppImage"
          cd "$RUNNER_TEMP/TraceGardenAppImage"
          "$GITHUB_WORKSPACE/dist/TraceGarden-Linux-x86_64.AppImage" --appimage-extract
          cd "$GITHUB_WORKSPACE"
          python scripts/smoke_native.py "$RUNNER_TEMP/TraceGardenAppImage/squashfs-root/AppRun"
      - uses: actions/upload-artifact@v4
        with:
          name: TraceGarden-${{ matrix.os }}
          path: |
            dist/TraceGarden-Windows-Setup.exe
            dist/TraceGarden-Windows-portable.zip
            dist/*.dmg
            dist/TraceGarden-Linux-x86_64.AppImage
